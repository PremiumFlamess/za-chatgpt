<script>
const KEY='rsaf_prototype_v1';
const PERMS=['soldiers.view','soldiers.manage','trainings.manage','deployments.manage','ranks.manage','brigades.manage','users.manage','audit.view'];
const defaultData={
 users:[
  {id:'u1',username:'admin',password:'Kralj2026!',display:'Kralj',role:'Royal Family',permissions:[...PERMS]},
  {id:'u2',username:'trainer',password:'Trainer2026!',display:'Demo Instructor',role:'Instructor',permissions:['soldiers.view','trainings.manage','deployments.manage']}
 ],
 ranks:['Vojnik','Razvodnik','Desetar','Mlađi Vodnik','Vodnik','Stariji Vodnik','Zastavnik','Potporučnik','Poručnik','Kapetan','Major','Potpukovnik','Pukovnik','Brigadni General','General-Major','General Potpukovnik','Armijski General'],
 brigades:[{id:'b1',name:'1. Gardijska brigada',description:'Gardijske i ceremonijalne dužnosti'},{id:'b2',name:'2. Pešadijska brigada',description:'Osnovna kopnena jedinica'},{id:'b3',name:'Specijalna jedinica',description:'Posebne zadatke odobrava komanda'}],
 soldiers:[
  {id:'s1',roblox:'SerbianGuard01',discord:'guard.one',rank:'Razvodnik',points:28,brigade:'b1',strikes:0,notes:'',registered:new Date().toISOString()},
  {id:'s2',roblox:'Milos_RP',discord:'milos#1042',rank:'Vojnik',points:8,brigade:'b2',strikes:1,notes:'Prisustvovao uvodnoj obuci.',registered:new Date(Date.now()-86400000*2).toISOString()}
 ],
 trainings:[],deployments:[],promotionPoints:{'Vojnik':0,'Razvodnik':25,'Desetar':50,'Mlađi Vodnik':80,'Vodnik':115,'Stariji Vodnik':155,'Zastavnik':200,'Potporučnik':250,'Poručnik':310,'Kapetan':380,'Major':460,'Potpukovnik':550,'Pukovnik':650,'Brigadni General':760,'General-Major':880,'General Potpukovnik':1010,'Armijski General':1150},audit:[]
};
let db,me=null,page='dashboard',lang='sr-Latn';
function soldierDashboard(){
 const s=db.soldiers.find(x=>x.id===me.soldierId);
 if(!s)return `<div class="pagehead"><div><h1>Nalog nije povezan</h1><p class="sub">Obrati se administratoru.</p></div></div>`;
 const next=nextRankInfo(s),remaining=next?Math.max(0,next.required-(+s.points||0)):0;
 const trainingRows=db.trainings.flatMap(tr=>tr.attendees.filter(a=>a.soldierId===s.id).map(a=>({title:tr.title,date:tr.date,points:a.points,notes:a.notes,type:'Trening'})));
 const eventRows=(db.deployments||[]).flatMap(ev=>ev.attendees.filter(a=>a.soldierId===s.id).map(a=>({title:ev.title,date:ev.date,points:a.points,notes:a.notes,type:ev.kind})));
 const history=[...trainingRows,...eventRows].sort((a,b)=>new Date(b.date)-new Date(a.date));
 return head('Moj vojnički profil','Lični pregled podataka i napretka.')+
 `<div class="grid stats">
 <div class="card stat"><div><span class="label">Trenutni broj poena</span><strong>${Number(s.points)||0}</strong></div><div class="symbol">★</div></div>
 <div class="card stat"><div><span class="label">Trenutni čin</span><strong style="font-size:19px">${esc(s.rank)}</strong></div><div class="symbol">♜</div></div>
 <div class="card stat"><div><span class="label">Strikes</span><strong>${Number(s.strikes)||0}</strong></div><div class="symbol">!</div></div>
 <div class="card stat"><div><span class="label">Brigada</span><strong style="font-size:17px">${esc(s.brigade||'Nije raspoređen')}</strong></div><div class="symbol">⚑</div></div>

function makeSoldierUsername(){
 const base='vojnik'+Math.random().toString(36).slice(2,7);let name=base,n=2;
 while(db.users.some(u=>u.username.toLowerCase()===name.toLowerCase()))name=base+n++;
 return name;
}
function makeSoldierPassword(){
 const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%';let out='';
 for(let i=0;i<12;i++)out+=chars[crypto.getRandomValues(new Uint32Array(1))[0]%chars.length];
 return out;
}

function saveTraining(){let title=document.getElementById('ttitle').value.trim();if(!title)return toast('Unesi naziv treninga.');let tr={id:crypto.randomUUID(),title,notes:document.getElementById('tnotes').value,date:new Date().toISOString(),instructor:me.username,attendees:[]};db.trainings.unshift(tr);log('CREATE_TRAINING',title);save();closeModal();drawPage();toast('Trening kreiran.')}
function attendanceModal(id){let tr=db.trainings.find(x=>x.id===id);openModal('Manage attendance',`<p class="muted">${esc(tr.title)} · Search by Roblox or Discord username</p><div class="search" style="margin-bottom:12px"><input id="attsearch" placeholder="Search soldier..." oninput="searchAttendance('${id}')"></div><div id="attresults"></div><h3>Attendance list</h3><div id="attlist">${attendanceList(tr)}</div>`,'',`<button class="btn" onclick="closeModal()">Done</button>`);searchAttendance(id)}
function attendanceList(tr){return tr.attendees.map(a=>{let s=db.soldiers.find(x=>x.id===a.soldierId);return s?`<div class="activity-item"><div class="dot"></div><div style="flex:1"><b>${esc(s.roblox)}</b><small>${esc(s.discord)} · ${a.points>=0?'+':''}${a.points} points · ${esc(a.notes||'No notes')}</small><button class="btn small" onclick="editAttendance('${tr.id}','${s.id}')">Edit points / notes</button></div></div>`:''}).join('')||'<p class="muted">No attendees yet.</p>'}
function searchAttendance(id){let tr=db.trainings.find(x=>x.id===id),q=(document.getElementById('attsearch')?.value||'').toLowerCase();let list=db.soldiers.filter(s=>(s.roblox+' '+s.discord).toLowerCase().includes(q)&&!tr.attendees.some(a=>a.soldierId===s.id));document.getElementById('attresults').innerHTML=list.slice(0,8).map(s=>`<div class="activity-item"><div style="flex:1"><b>${esc(s.roblox)}</b><small>${esc(s.discord)} · ${esc(s.rank)}</small></div><button class="btn small primary" onclick="addAttendance('${id}','${s.id}')">Add</button></div>`).join('')||'<p class="muted">No matching available soldiers.</p>'}
function addAttendance(tid,sid){let tr=db.trainings.find(x=>x.id===tid);tr.attendees.push({soldierId:sid,points:0,notes:''});log('TRAINING_ATTENDANCE',db.soldiers.find(s=>s.id===sid)?.roblox+' attended '+tr.title);save();attendanceModal(tid)}
function editAttendance(tid,sid){let tr=db.trainings.find(x=>x.id===tid),a=tr.attendees.find(x=>x.soldierId===sid),s=db.soldiers.find(x=>x.id===sid);openModal('Attendance record',`<p><b>${esc(s.roblox)}</b> · Current points: ${s.points}</p><div class="formgrid"><div class="field"><label>Points to add / remove</label><input id="apoints" type="number" value="${a.points}"><span class="hint">Use a negative number to deduct points.</span></div><div class="field"><label>Soldier total points</label><input id="atotal" type="number" value="${s.points}"></div><div class="field full"><label>Training notes</label><textarea id="anotes">${esc(a.notes)}</textarea></div></div>`,'',`<button class="btn" onclick="attendanceModal('${tid}')">Back</button><button class="btn primary" onclick="saveAttendance('${tid}','${sid}')">Save record</button>`)}
function saveAttendance(tid,sid){let tr=db.trainings.find(x=>x.id===tid),a=tr.attendees.find(x=>x.soldierId===sid),s=db.soldiers.find(x=>x.id===sid);let delta=+document.getElementById('apoints').value||0,total=Math.max(0,+document.getElementById('atotal').value||0);a.points=delta;a.notes=document.getElementById('anotes').value;s.points=total;log('UPDATE_TRAINING_RECORD',s.roblox+' · points '+total+' · session '+tr.title);save();attendanceModal(tid);toast('Attendance updated.')}
function deleteTraining(id){let tr=db.trainings.find(x=>x.id===id);if(confirm('Delete training '+tr.title+'?')){db.trainings=db.trainings.filter(x=>x.id!==id);log('DELETE_TRAINING',tr.title);save();drawPage()}}
function brigadesPage(){if(!has('brigades.manage'))return '<div class="empty">Nemate dozvolu za upravljanje brigadama.</div>';return head('Brigade',t('Dodavanje, uređivanje i uklanjanje brigada.','Додавање, уређивање и уклањање бригада.','Create, edit and remove military brigades.'),`<button class="btn primary" onclick="brigadeModal()">+ Add brigade</button>`)+`<div class="grid briga-grid">${db.brigades.map(b=>`<div class="card brigade-card"><div class="eyebrow">ROYAL SERBIAN ARMED FORCES</div><h3>${esc(b.name)}</h3><p>${esc(b.description)}</p><div class="count">${db.soldiers.filter(s=>s.brigade===b.name).length}</div><small class="muted">Assigned soldiers</small><div style="margin-top:14px"><button class="btn small" onclick="brigadeModal('${b.id}')">Edit</button> <button class="btn small danger" onclick="removeBrigade('${b.id}')">Remove</button></div></div>`).join('')||'<div class="empty">No brigades yet.</div>'}</div>`}
function brigadeModal(id){let b=db.brigades.find(x=>x.id===id)||{name:'',description:''};openModal(id?'Edit brigade':'Add brigade',`<div class="formgrid"><div class="field full"><label>Brigade name</label><input id="bname" value="${esc(b.name)}"></div><div class="field full"><label>Description</label><textarea id="bdesc">${esc(b.description)}</textarea></div></div>`,'',`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveBrigade('${id||''}')">Save</button>`)}
function saveBrigade(id){let name=document.getElementById('bname').value.trim();if(!name)return toast('Enter a brigade name.');let b=db.brigades.find(x=>x.id===id);if(b){let old=b.name;b.name=name;b.description=document.getElementById('bdesc').value;db.soldiers.forEach(s=>{if(s.brigade===old)s.brigade=name})}else db.brigades.push({id:crypto.randomUUID(),name,description:document.getElementById('bdesc').value});log(id?'EDIT_BRIGADE':'ADD_BRIGADE',name);save();closeModal();drawPage()}
function removeBrigade(id){let b=db.brigades.find(x=>x.id===id);if(confirm('Remove '+b.name+'? Soldiers assigned to it will become unassigned.')){db.soldiers.forEach(s=>{if(s.brigade===b.name)s.brigade=''});db.brigades=db.brigades.filter(x=>x.id!==id);log('REMOVE_BRIGADE',b.name);save();drawPage()}}
function ranksPage(){if(!has('ranks.manage'))return '<div class="empty">Nemate dozvolu za upravljanje činovima.</div>';return head(t('Vojni činovi','Војни чинови','Military ranks'),t('Upravljaj listom činova koji se nude pri registraciji i izmeni vojnika.','Управљај листом чинова који се нуде при регистрацији и измени војника.','Manage the rank list used in soldier records.'),`<button class="btn primary" onclick="rankModal()">+ Add rank</button>`)+`<div class="card"><div class="rank-list">${db.ranks.map((r,i)=>`<div class="rank-row"><div><b>${i+1}. ${esc(r)}</b><br><small>${db.soldiers.filter(s=>s.rank===r).length} soldiers</small></div><button class="btn small danger" onclick="removeRank(${i})">Remove</button></div>`).join('')}</div></div>`}
function rankModal(){openModal('Add military rank',`<div class="field"><label>Rank name</label><input id="rname" placeholder="Novi čin"></div>`,'',`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRank()">Add rank</button>`)}
function saveRank(){let n=document.getElementById('rname').value.trim();if(!n)return toast('Enter rank name.');if(db.ranks.includes(n))return toast('Rank already exists.');db.ranks.push(n);log('ADD_RANK',n);save();closeModal();drawPage()}
function removeRank(i){let r=db.ranks[i];if(db.soldiers.some(s=>s.rank===r))return toast('Cannot remove a rank assigned to soldiers. Reassign them first.');if(confirm('Remove rank '+r+'?')){db.ranks.splice(i,1);log('REMOVE_RANK',r);save();drawPage()}}
function copyAccountCredentials(username,password){const value='Username: '+username+'\nPassword: '+password;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(value).then(()=>toast('Podaci su kopirani.')).catch(()=>toast(value));else toast(value)}
function usersPage(){
 if(!has('users.manage'))return '<div class="empty">Nemate dozvolu za upravljanje nalozima.</div>';
 const rows=db.users.map(u=>{const soldier=u.soldierId?db.soldiers.find(s=>s.id===u.soldierId):null;const perms=u.role==='Royal Family'?'Sve dozvole':(u.permissions||[]).length+' dozvola';const isKing=u.id==='u1';const passwordCell=isKing?'<span class="credential">••••••••</span><span class="muted" style="display:block;font-size:11px">Zaštićeno</span>':`<span class="credential">${esc(u.password||'')}</span><button class="btn small ghost" onclick="copyAccountCredentials('${esc(u.username)}','${esc(u.password||'')}')">Kopiraj</button>`;return `<tr><td><b>${esc(u.username)}</b></td><td>${passwordCell}</td><td>${esc(u.display||'—')}${soldier?`<small class="muted" style="display:block">Vojnik: ${esc(soldier.roblox)}</small>`:''}</td><td><span class="tag gold">${esc(u.role)}</span></td><td>${perms}</td><td><button class="btn small" onclick="userModal('${u.id}')">Izmeni</button> ${u.id!=='u1'?`<button class="btn small danger" onclick="removeUser('${u.id}')">Ukloni</button>`:'<span class="tag green">Kralj · zaštićen</span>'}</td></tr>`}).join('');
 return head('Nalozi i dozvole','Pregled korisničkih imena i lozinki, upravljanje nalozima i podešavanje dozvola.',`<button class="btn primary" onclick="userModal()">+ Dodaj nalog</button>`)+
 `<div class="card" style="margin-bottom:14px"><b>Kralj ima sve dozvole po default-u.</b><p class="muted" style="margin:5px 0 0">Samo Kralj može da upravlja nalozima. Lozinke korisnika su dostupne ovlašćenom administratoru.</p></div><div class="tablewrap"><table><thead><tr><th>Korisničko ime</th><th>Lozinka</th><th>Ime / povezani vojnik</th><th>Uloga</th><th>Dozvole</th><th>Akcije</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">Nema naloga.</td></tr>'}</tbody></table></div><p class="hint">Nalozi vojnika se automatski prave prilikom dodavanja vojnika. Uklanjanje vojničkog naloga ne briše vojnički dosije.</p>`;
}
function userModal(id){
 if(!has('users.manage'))return;
 let u=db.users.find(x=>x.id===id)||{username:'',password:'',display:'',role:'Instructor',permissions:['soldiers.view','trainings.manage','deployments.manage']};
 const protectedKing=!!id&&u.id==='u1';
 openModal(id?'Izmeni nalog':'Dodaj nalog',`<div class="formgrid"><div class="field"><label>Korisničko ime</label><input id="uusername" value="${esc(u.username)}" ${id?'disabled':''}></div><div class="field"><label>Lozinka</label>${protectedKing?'<input id="upassword" type="password" value="" placeholder="Lozinka je zaštićena" disabled><small class="muted">Lozinka glavnog naloga nije dostupna za pregled.</small>':`<input id="upassword" type="text" value="" placeholder="${id?'Nova lozinka (prazno = zadrži postojeću)':'Unesi lozinku'}">`}</div><div class="field"><label>Ime za prikaz</label><input id="udisplay" value="${esc(u.display)}"></div><div class="field"><label>Uloga</label><select id="urole" ${protectedKing?'disabled':''}><option ${u.role==='Instructor'?'selected':''}>Instructor</option><option ${u.role==='Senior Instructor'?'selected':''}>Senior Instructor</option><option ${u.role==='Command Staff'?'selected':''}>Command Staff</option><option ${u.role==='Royal Family'?'selected':''}>Royal Family</option><option ${u.role==='Soldier'?'selected':''}>Soldier</option></select></div><div class="field full"><label>Dozvole ${protectedKing?'(Kralj uvek ima sve dozvole)':''}</label>${PERMS.map(p=>`<label class="checkrow"><input type="checkbox" name="uperm" value="${p}" ${(u.role==='Royal Family'||u.permissions.includes('*')||u.permissions.includes(p))?'checked':''} ${protectedKing?'disabled':''}> ${p}</label>`).join('')}</div></div>`, '',`<button class="btn" onclick="closeModal()">Otkaži</button><button class="btn primary" onclick="saveUser('${id||''}')">Sačuvaj nalog</button>`);
}
function saveUser(id){
 if(!has('users.manage'))return;
 let old=db.users.find(x=>x.id===id),username=old?.username||document.getElementById('uusername').value.trim();
 if(!username)return toast('Unesi korisničko ime.');
 if(!old&&db.users.some(u=>u.username.toLowerCase()===username.toLowerCase()))return toast('Korisničko ime već postoji.');
 let pass=document.getElementById('upassword').value;
 if(!old&&!pass)return toast('Unesi lozinku.');
 let role=old?.id==='u1'?'Royal Family':document.getElementById('urole').value;
 let perms=role==='Royal Family'?[...PERMS]:[...document.querySelectorAll('input[name="uperm"]:checked')].map(x=>x.value);
 let data={username,password:pass||old?.password,display:document.getElementById('udisplay').value.trim()||username,role,permissions:perms};
 if(old)Object.assign(old,data);else db.users.push({id:crypto.randomUUID(),...data});
 if(old&&old.soldierId){const soldier=db.soldiers.find(s=>s.id===old.soldierId);if(soldier)soldier.roblox=data.display;}
 log(old?'EDIT_ACCOUNT':'CREATE_ACCOUNT',username+' · '+data.role);save();closeModal();drawPage();toast('Nalog je sačuvan.');
}
function removeUser(id){
 if(!has('users.manage'))return;
 let u=db.users.find(x=>x.id===id);if(!u||u.id==='u1')return toast('Glavni Kraljev nalog ne može biti uklonjen.');
 if(confirm('Ukloniti nalog '+u.username+'?'+(u.soldierId?' Vojnički dosije ostaje sačuvan.':''))){db.users=db.users.filter(x=>x.id!==id);const soldier=db.soldiers.find(s=>s.userId===id);if(soldier)soldier.userId=null;log('DELETE_ACCOUNT',u.username);save();drawPage();}
}
function auditPage(){if(!isRoyal())return '<div class="empty">Audit log is restricted to Royal Family members.</div>';return head('Audit log',t('Evidencija aktivnosti i promena u sistemu. Dostupno samo Kraljevskoj porodici.','Евиденција активности и промена у систему. Доступно само Краљевској породици.','System activity and change history. Royal Family access only.'),`<button class="btn" onclick="exportAudit()">Export CSV</button>`)+`<div class="tablewrap"><table><thead><tr><th>Timestamp</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>${db.audit.map(a=>`<tr><td>${date(a.time)}</td><td>${esc(a.user)}</td><td><span class="tag">${esc(a.action)}</span></td><td>${esc(a.details)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No audit entries yet.</td></tr>'}</tbody></table></div>`}
function exportAudit(){let rows=[['Timestamp','User','Action','Details'],...db.audit.map(a=>[a.time,a.user,a.action,a.details])];let csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='royal-audit-log.csv';a.click();URL.revokeObjectURL(a.href)}
function openModal(title,body,left='',right=''){document.getElementById('modaltitle').textContent=title;document.getElementById('modalbody').innerHTML=body;document.getElementById('modalfoot').innerHTML=left+right;document.getElementById('modalback').classList.add('show')}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});

// --- Deployment, rally and promotion system ---
const DEFAULT_PROMOTION_POINTS={'Vojnik':0,'Razvodnik':25,'Desetar':50,'Mlađi Vodnik':80,'Vodnik':115,'Stariji Vodnik':155,'Zastavnik':200,'Potporučnik':250,'Poručnik':310,'Kapetan':380,'Major':460,'Potpukovnik':550,'Pukovnik':650,'Brigadni General':760,'General-Major':880,'General Potpukovnik':1010,'Armijski General':1150};
function ensureExtendedData(){
 if(!Array.isArray(db.deployments))db.deployments=[];
 if(!db.promotionPoints)db.promotionPoints={...DEFAULT_PROMOTION_POINTS};
 else Object.entries(DEFAULT_PROMOTION_POINTS).forEach(([r,v])=>{if(db.promotionPoints[r]===undefined)db.promotionPoints[r]=v});
 db.users.forEach(u=>{if(u.username==='trainer'&&!u.permissions.includes('deployments.manage'))u.permissions.push('deployments.manage')});
}
function nextRankInfo(s){
 const i=db.ranks.indexOf(s.rank);
 if(i<0||i>=db.ranks.length-1)return null;
 const next=db.ranks[i+1],required=Number(db.promotionPoints[next]??DEFAULT_PROMOTION_POINTS[next]??0);
 return {next,required,eligible:(+s.points||0)>=required};
}
function promotionBadge(s){
 const n=nextRankInfo(s);
 if(!n||!n.eligible)return '';
 if(s.promotionDecision&&s.promotionDecision.decision==='rejected'&&s.promotionDecision.pointsAtDecision===(+s.points||0))return '';
 return `<button class="btn small primary promotion-alert" title="Promotion available" onclick="promotionModal('${s.id}')">! Promotion</button>`;
}
function soldiersPage(){
 if(!has('soldiers.view'))return '<div class="empty">Nemate dozvolu za pregled vojnika.</div>';
 let q=(window.sq||'').toLowerCase();
 let arr=db.soldiers.filter(s=>(s.roblox+' '+s.discord+' '+s.rank+' '+s.brigade).toLowerCase().includes(q));
 return head(t('Vojnici','Војници','Soldiers'),t('Evidencija, činovi, poeni i disciplinske beleške.','Евиденција, чинови, поени и дисциплинске белешке.','Personnel records, ranks, points and disciplinary notes.'),has('soldiers.manage')?`<button class="btn primary" onclick="soldierModal()">+ ${t('Dodaj vojnika','Додај војника','Add soldier')}</button>`:'')+
 `<div class="toolbar"><div class="search"><input placeholder="${t('Pretraži Roblox, Discord ili čin...','Претражи Roblox, Discord или чин...','Search Roblox, Discord or rank...')}" value="${esc(window.sq||'')}" oninput="window.sq=this.value;drawPage()"></div><span class="tag">${arr.length} / ${db.soldiers.length}</span></div>
 <div class="tablewrap"><table><thead><tr><th>Roblox / Discord</th><th>${t('Čin','Чин','Rank')}</th><th>${t('Brigada','Бригада','Brigade')}</th><th>${t('Poeni','Поени','Points')}</th><th>Promotion</th><th>${t('Strikes','Страјкови','Strikes')}</th><th>${t('Registrovan','Регистрован','Registered')}</th><th></th></tr></thead><tbody>
 ${arr.map(s=>`<tr><td class="namecell"><b>${esc(s.roblox)}</b><small>${esc(s.discord)}</small></td><td><span class="tag gold">${esc(s.rank)}</span></td><td>${esc(s.brigade||'—')}</td><td><b>${s.points}</b></td><td>${promotionBadge(s)||'<span class="muted">—</span>'}</td><td>${s.strikes?`<span class="tag red">${s.strikes}</span>`:'—'}</td><td>${new Date(s.registered).toLocaleDateString()}</td><td>${has('soldiers.manage')?`<button class="btn small" onclick="soldierModal('${s.id}')">Manage</button>`:`<button class="btn small" onclick="viewSoldier('${s.id}')">View</button>`}</td></tr>`).join('')||`<tr><td colspan="8" class="empty">Nema rezultata.</td></tr>`}
 </tbody></table></div><p class="hint">The exclamation mark appears when a soldier reaches the point requirement for the next rank.</p>`;
}
function promotionModal(id){
 if(!has('soldiers.manage'))return;
 const s=db.soldiers.find(x=>x.id===id),n=s&&nextRankInfo(s);if(!s||!n||!n.eligible)return toast('Promotion requirements are not met.');
 openModal('Promotion review',`<div class="card"><div class="eyebrow">PROMOTION ELIGIBILITY</div><h3>${esc(s.roblox)}</h3><p class="muted">${esc(s.rank)} → <b>${esc(n.next)}</b></p><div class="grid stats" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><span class="muted">Current points</span><h2>${s.points}</h2></div><div><span class="muted">Required points</span><h2>${n.required}</h2></div></div></div><div class="field" style="margin-top:14px"><label>Decision reason *</label><textarea id="promotionreason" placeholder="Write the reason for approving or rejecting this promotion..."></textarea></div>`,
 `<button class="btn danger" onclick="decidePromotion('${id}','rejected')">Reject promotion</button>`,
 `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="decidePromotion('${id}','approved')">Approve promotion</button>`);
}
function decidePromotion(id,decision){
 const s=db.soldiers.find(x=>x.id===id),n=s&&nextRankInfo(s),reason=document.getElementById('promotionreason').value.trim();
 if(!reason)return toast('A reason is required for this decision.');
 if(!s||!n||!n.eligible)return toast('Promotion is no longer eligible.');
 if(decision==='approved'){const old=s.rank;s.rank=n.next;s.promotionDecision={decision,from:old,to:n.next,reason,by:me.username,at:new Date().toISOString()};log('PROMOTION_APPROVED',`${s.roblox}: ${old} → ${n.next}. Reason: ${reason}`);toast('Promotion approved.')}
 else{s.promotionDecision={decision,pointsAtDecision:+s.points||0,from:s.rank,to:n.next,reason,by:me.username,at:new Date().toISOString()};log('PROMOTION_REJECTED',`${s.roblox}: ${n.next}. Reason: ${reason}`);toast('Promotion rejected.')}
 save();closeModal();drawPage();
}
function ranksPage(){
 if(!has('ranks.manage'))return '<div class="empty">Nemate dozvolu za upravljanje činovima.</div>';
 return head(t('Vojni činovi','Војни чинови','Military ranks'),t('Upravljaj činovima i minimalnim brojem poena za unapređenje.','Управљај чиновима и минималним бројем поена за унапређење.','Manage ranks and the minimum points required for promotion.'),`<button class="btn primary" onclick="rankModal()">+ Add rank</button>`)
 +`<div class="card"><h3>Promotion System · Required points</h3><p class="muted">Set the total points a soldier must have to be eligible for each rank. Requirements are cumulative.</p><div class="tablewrap"><table><thead><tr><th>Rank</th><th>Required points</th><th></th></tr></thead><tbody>${db.ranks.map((r,i)=>`<tr><td><b>${esc(r)}</b></td><td><b>${Number(db.promotionPoints[r]??0)}</b></td><td><button class="btn small" onclick="editPromotionPoints('${esc(r).replace(/'/g,"\\'")}')">Edit points</button></td></tr>`).join('')}</tbody></table></div></div>
 <div class="card" style="margin-top:14px"><h3>Rank list</h3><div class="rank-list">${db.ranks.map((r,i)=>`<div class="rank-row"><div><b>${i+1}. ${esc(r)}</b><br><small>${db.soldiers.filter(s=>s.rank===r).length} soldiers</small></div><button class="btn small danger" onclick="removeRank(${i})">Remove</button></div>`).join('')}</div></div>`;

function editPromotionPoints(rank){
 const current=Number(db.promotionPoints[rank]??0);
 openModal('Edit promotion requirement',`<p><b>${esc(rank)}</b></p><div class="field"><label>Required total points</label><input id="promotionpoints" type="number" min="0" value="${current}"></div>`,'',`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePromotionPoints('${esc(rank).replace(/'/g,"\\'")}')">Save requirement</button>`);
}
function savePromotionPoints(rank){
 const val=Number(document.getElementById('promotionpoints').value);
 if(!Number.isFinite(val)||val<0)return toast('Enter a valid non-negative points value.');
 db.promotionPoints[rank]=Math.floor(val);log('UPDATE_PROMOTION_REQUIREMENT',`${rank}: ${val} points`);save();closeModal();drawPage();toast('Promotion requirement updated.');
}
function deploymentsPage(){
 if(!has('deployments.manage'))return '<div class="empty">You do not have permission to manage deployments and rallies.</div>';
 return head('Deployments & Rallies','Record deployments, rallies, attendance and awarded points.',`<button class="btn primary" onclick="deploymentModal()">+ Create record</button>`)
 +`<div class="toolbar"><span class="tag">${db.deployments.length} records</span></div><div class="tablewrap"><table><thead><tr><th>Event</th><th>Type</th><th>Date & time</th><th>Instructor</th><th>Participants</th><th></th></tr></thead><tbody>${db.deployments.map(e=>`<tr><td><b>${esc(e.title)}</b>${e.category?`<small>${esc(e.category)}</small>`:''}</td><td><span class="tag ${e.kind==='Rally'?'gold':''}">${esc(e.kind)}</span></td><td>${date(e.date)}</td><td>${esc(e.instructor)}</td><td>${e.attendees.length}</td><td><button class="btn small" onclick="deploymentAttendance('${e.id}')">Manage attendance</button> <button class="btn small danger" onclick="deleteDeployment('${e.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No deployment or rally records yet.</td></tr>'}</tbody></table></div>`;
}
function deploymentModal(){
 if(!has('deployments.manage'))return;
 const local=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
 openModal('Create deployment / rally',`<div class="formgrid"><div class="field full"><label>Event title *</label><input id="evtitle" placeholder="e.g. Weekend community deployment"></div><div class="field"><label>Record type</label><select id="evkind" onchange="toggleRallyCategory()"><option>Deployment</option><option>Rally</option></select></div><div class="field" id="rallycatwrap" style="display:none"><label>Rally category</label><select id="evcategory"><option>Economic action</option><option>Military action</option></select></div><div class="field full"><label>Date & time</label><input id="evdate" type="datetime-local" value="${local}"></div><div class="field full"><label>Notes</label><textarea id="evnotes" placeholder="Event details..."></textarea></div></div><p class="hint">After creating the record, use Manage attendance to search for soldiers by Roblox or Discord username and record their points.</p>`,'',`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveDeployment()">Create record</button>`);
}
function toggleRallyCategory(){const kind=document.getElementById('evkind').value;document.getElementById('rallycatwrap').style.display=kind==='Rally'?'':'none';}
function saveDeployment(){
 const title=document.getElementById('evtitle').value.trim(),kind=document.getElementById('evkind').value,raw=document.getElementById('evdate').value;
 if(!title)return toast('Enter an event title.');
 if(!raw)return toast('Select the event date and time.');
 const ev={id:crypto.randomUUID(),title,kind,category:kind==='Rally'?document.getElementById('evcategory').value:'',date:new Date(raw).toISOString(),notes:document.getElementById('evnotes').value,instructor:me.username,attendees:[]};
 db.deployments.unshift(ev);log('CREATE_'+kind.toUpperCase(),`${title}${ev.category?' · '+ev.category:''} · ${date(ev.date)}`);save();closeModal();drawPage();toast('Event record created.');
}
function deploymentAttendance(id){
 const ev=db.deployments.find(x=>x.id===id);if(!ev)return;
 openModal('Event attendance',`<p class="muted"><b>${esc(ev.title)}</b> · ${esc(ev.kind)}${ev.category?' / '+esc(ev.category):''} · ${date(ev.date)}</p><div class="search" style="margin-bottom:12px"><input id="evsearch" placeholder="Search Roblox or Discord username..." oninput="searchEventSoldiers('${id}')"></div><div id="evresults"></div><h3>Participants</h3><div id="evattlist">${eventAttendanceList(ev)}</div>`,'',`<button class="btn" onclick="closeModal()">Done</button>`);
 searchEventSoldiers(id);
}
function eventAttendanceList(ev){
 return ev.attendees.map(a=>{const s=db.soldiers.find(x=>x.id===a.soldierId);return s?`<div class="activity-item"><div class="dot"></div><div style="flex:1"><b>${esc(s.roblox)}</b><small>${esc(s.discord)} · ${a.points>=0?'+':''}${a.points} points · ${esc(a.notes||'No notes')}</small><button class="btn small" onclick="editEventAttendance('${ev.id}','${s.id}')">Edit points / notes</button></div><button class="btn small danger" onclick="removeEventAttendee('${ev.id}','${s.id}')">Remove</button></div>`:''}).join('')||'<p class="muted">No participants yet.</p>';
}
function searchEventSoldiers(id){
 const ev=db.deployments.find(x=>x.id===id),q=(document.getElementById('evsearch')?.value||'').toLowerCase();if(!ev)return;
 const matches=db.soldiers.filter(s=>(s.roblox+' '+s.discord).toLowerCase().includes(q)&&!ev.attendees.some(a=>a.soldierId===s.id));
 document.getElementById('evresults').innerHTML=matches.slice(0,10).map(s=>`<div class="activity-item"><div style="flex:1"><b>${esc(s.roblox)}</b><small>${esc(s.discord)} · ${esc(s.rank)}</small></div><button class="btn small primary" onclick="addEventAttendee('${id}','${s.id}')">Add</button></div>`).join('')||'<p class="muted">No matching available soldiers.</p>';
}
function addEventAttendee(eid,sid){
 const ev=db.deployments.find(x=>x.id===eid);if(!ev||ev.attendees.some(a=>a.soldierId===sid))return;
 ev.attendees.push({soldierId:sid,points:0,notes:''});log('EVENT_ATTENDANCE',`${db.soldiers.find(s=>s.id===sid)?.roblox} attended ${ev.title}`);save();deploymentAttendance(eid);
}
function editEventAttendance(eid,sid){
 const ev=db.deployments.find(x=>x.id===eid),a=ev?.attendees.find(x=>x.soldierId===sid),s=db.soldiers.find(x=>x.id===sid);if(!a||!s)return;
 openModal('Participant record',`<p><b>${esc(s.roblox)}</b> · Current total: ${s.points} points</p><div class="formgrid"><div class="field"><label>Points to add / deduct</label><input id="epdelta" type="number" value="${a.points}"><span class="hint">Use a negative value to deduct points.</span></div><div class="field"><label>New soldier total</label><input id="eptotal" type="number" min="0" value="${s.points}"></div><div class="field full"><label>Participant notes</label><textarea id="epnotes">${esc(a.notes)}</textarea></div></div>` ,`<button class="btn" onclick="deploymentAttendance('${eid}')">Back</button>`,`<button class="btn primary" onclick="saveEventAttendance('${eid}','${sid}')">Save changes</button>`);
}
function saveEventAttendance(eid,sid){
 const ev=db.deployments.find(x=>x.id===eid),a=ev?.attendees.find(x=>x.soldierId===sid),s=db.soldiers.find(x=>x.id===sid);if(!a||!s)return;
 const total=Number(document.getElementById('eptotal').value),delta=Number(document.getElementById('epdelta').value)||0;
 if(!Number.isFinite(total)||total<0)return toast('Enter a valid total points value.');
 a.points=delta;a.notes=document.getElementById('epnotes').value;s.points=Math.floor(total);
 log('UPDATE_EVENT_PARTICIPANT',`${s.roblox} · ${ev.title} · ${delta>=0?'+':''}${delta} · total ${s.points}`);
 save();deploymentAttendance(eid);toast('Participant record updated.');
}
function removeEventAttendee(eid,sid){
 const ev=db.deployments.find(x=>x.id===eid);if(!ev)return;
 ev.attendees=ev.attendees.filter(a=>a.soldierId!==sid);log('REMOVE_EVENT_PARTICIPANT',`${sid} removed from ${ev.title}`);save();deploymentAttendance(eid);
}
function deleteDeployment(id){
 const ev=db.deployments.find(x=>x.id===id);if(!ev)return;
 if(!confirm('Delete this event record?'))return;
 db.deployments=db.deployments.filter(x=>x.id!==id);log('DELETE_EVENT',ev.title);save();drawPage();
}

function load(){
 if(!db)return;
 if(!db.users||!db.soldiers)throw new Error('Neispravni podaci u bazi.');
 ensureExtendedData();
 db.users.forEach(u=>{u.permissions=Array.isArray(u.permissions)?u.permissions:[];if(u.id==='u1'||u.role==='Royal Family'){u.role='Royal Family';u.permissions=[...PERMS]}});
 db.soldiers.forEach(s=>{if(!Object.prototype.hasOwnProperty.call(s,'userId'))s.userId=null;});
}

 const direct=(db?.ministryMembers||[]).find(x=>x.userId===me?.id&&x.ministry===ministry)||null;

function bbSaveMembership(){if(!bbIsAdmin())return;const userId=document.getElementById('bbuser').value,ministry=document.getElementById('bbministry').value,position=document.getElementById('bbposition').value,permissions=[...document.querySelectorAll('input[name="bbperm"]:checked')].map(x=>x.value);if(!userId)return toast('No account selected.');db.ministryMembers=db.ministryMembers||[];let old=db.ministryMembers.find(x=>x.userId===userId&&x.ministry===ministry);const row={id:old?.id||crypto.randomUUID(),userId,ministry,position,permissions};if(old)Object.assign(old,row);else db.ministryMembers.push(row);log('MINISTRY_ACCESS_ASSIGNED',`${userId} · ${ministry} · ${position}`);save();bbManageMemberships();}

function bbShowRolePanel(){

><select id="bbrolechoice">'+roles.map(r=>'<option value="'+r.id+'">'+bbEscape(r.name)+'</option>').join('')+'</select><button class="btn primary" onclick="bbAssignRole()">Assign role</button></div><p class="hint">The main administrator account is excluded and cannot be assigned or modified here.</p></section></div><section class="card" style="margin-top:16px"><h3>Existing roles</h3><div class="tablewrap"><table><thead><tr><th>Role</th><th>Ministries</th><th>Permissions</th><th>Actions</th></tr></thead><tbody>'+(roleRows||'<tr><td colspan="4" class="empty">No roles created yet.</td></tr>')+'</tbody></table></div></section><section class="card" style="margin-top:16px"><h3>Role assignments</h3><div class="tablewrap"><table><thead><tr><th>Account</th><th>Role</th><th></th></tr></thead><tbody>'+(assignments||'<tr><td colspan="3" class="empty">No roles assigned yet.</td></tr>')+'</tbody></table></div></section></main></div>';

function bbResetRoleForm(){bbEditingRoleId=null;bbShowRolePanel();}
function bbEditRole(id){
 if(!bbIsAdmin())return;const r=(db.roles||[]).find(x=>x.id===id);if(!r)return;
 bbShowRolePanel();document.getElementById('bbrolename').value=r.name;
 document.querySelectorAll('input[name="bbroleministry"]').forEach(x=>x.checked=(r.ministries||[]).includes(x.value));
 document.querySelectorAll('input[name="bbroleperm"]').forEach(x=>x.checked=(r.permissions||[]).includes(x.value));
 document.getElementById('bbroleformtitle').textContent='Edit role · '+r.name;bbEditingRoleId=id;
}
function bbSaveRole(){
 if(!bbIsAdmin())return;const name=document.getElementById('bbrolename').value.trim();
 const ministries=[...document.querySelectorAll('input[name="bbroleministry"]:checked')].map(x=>x.value);
 const permissions=[...document.querySelectorAll('input[name="bbroleperm"]:checked')].map(x=>x.value);
 if(!name)return toast('Enter a role name.');if(!ministries.length)return toast('Select at least one ministry.');
 if(!permissions.length)return toast('Select at least one permission.');
 db.roles=Array.isArray(db.roles)?db.roles:[];const old=db.roles.find(x=>x.id===bbEditingRoleId);
 const row={id:old?.id||crypto.randomUUID(),name,ministries,permissions};if(old)Object.assign(old,row);else db.roles.push(row);
 log(old?'EDIT_ROLE':'CREATE_ROLE',name);save();bbEditingRoleId=null;bbShowRolePanel();
}
function bbDeleteRole(id){
 if(!bbIsAdmin())return;const r=(db.roles||[]).find(x=>x.id===id);if(!r||!confirm('Delete role '+r.name+'?'))return;
 db.roles=db.roles.filter(x=>x.id!==id);db.users.forEach(u=>{if(u.id!==me.id)u.roleIds=(u.roleIds||[]).filter(x=>x!==id)});
 log('DELETE_ROLE',r.name);save();bbShowRolePanel();

function bbAssignRole(){
 if(!bbIsAdmin())return;const userId=document.getElementById('bbroleuser').value,roleId=document.getElementById('bbrolechoice').value;
 if(!userId||userId===me.id)return toast('The main administrator account is protected.');
 const user=db.users.find(u=>u.id===userId),role=(db.roles||[]).find(r=>r.id===roleId);if(!user||!role)return toast('Select an account and a role.');

 log('ASSIGN_ROLE',user.username+' · '+role.name);save();bbShowRolePanel();
}
function bbUnassignRole(userId,roleId){

function bbAnnouncementCard(a){return `<article class="portal-announcement"><div class="meta">${bbEscape(a.visibility==='internal'?'INTERNAL GOVERNMENT NOTICE':'PUBLIC ANNOUNCEMENT')} · ${bbEscape(new Date(a.createdAt||Date.now()).toLocaleString())}</div><h3>${bbEscape(a.title)}</h3><p>${bbEscape(a.body||'')}</p>${a.url?`<a href="${bbEscapeUrl(a.url)}" target="_blank" rel="noopener">Open link ↗</a>`:''}${bbIsAdmin()?`<div style="margin-top:10px"><button class="btn small danger" onclick="bbDeleteAnnouncement('${a.id}')">Delete announcement</button></div>`:''}</article>`;}
function bbAnnouncementModal(id){if(!bbIsAdmin()&&!bbCan(id,'announcements.manage')&&!(id==='government'&&bbCan(id,'government.internal')))return;const internal=id==='government';openModal('Publish announcement',`<div class="portal-form"><label>Title</label><input id="bbtitle" maxlength="160"><label>Announcement</label><textarea id="bbbody" rows="5"></textarea><label>Link (optional)</label><input id="bburl" type="url" placeholder="https://..."></div><p class="hint">${internal?'This notice is visible only to authorised Government members.':'This announcement is visible on the public portal.'}</p>`,'',`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="bbSaveAnnouncement('${id}')">Publish</button>`);}
function bbSaveAnnouncement(id){const title=document.getElementById('bbtitle').value.trim(),body=document.getElementById('bbbody').value.trim(),url=document.getElementById('bburl').value.trim();if(!title||!body)return toast('Title and announcement are required.');if(url&&bbEscapeUrl(url)==='#')return toast('Enter a valid http(s) URL.');db.announcements=db.announcements||[];db.announcements.unshift({id:crypto.randomUUID(),ministry:id,title,body,url,visibility:id==='government'?'internal':'public',createdAt:new Date().toISOString(),author:me.username});log('PUBLISH_ANNOUNCEMENT',`${id}: ${title}`);save();closeModal();render();}
function bbDeleteAnnouncement(id){if(!bbIsAdmin())return toast('Only the main administrator can delete announcements.');const a=(db.announcements||[]).find(x=>x.id===id);if(!a||!confirm('Delete this announcement?'))return;db.announcements=db.announcements.filter(x=>x.id!==id);log('DELETE_ANNOUNCEMENT',a.title);save();render();}
function bbFinancePage(){
 const can=canFinancePay(),rows=db.soldiers||[];
 return `<section class="card" style="margin-top:20px"><div class="section-title"><h3>Personnel and payroll</h3><span class="tag">${rows.length} soldiers</span></div><p class="muted">Existing Defence personnel records, training attendance, ranks and promotion points are shown here.</p><div class="tablewrap"><table><thead><tr><th>Soldier</th><th>Rank</th><th>Training attendance</th><th>Promotion points</th><th>Salary records</th><th></th></tr></thead><tbody>${rows.map(s=>{const attendance=(db.trainings||[]).filter(t=>(t.attendees||[]).some(a=>a.soldierId===s.id)).length;const salaries=(db.salaryRecords||[]).filter(x=>x.soldierId===s.id);return `<tr><td><b>${bbEscape(s.roblox)}</b><small class="muted" style="display:block">${bbEscape(s.discord)}</small></td><td>${bbEscape(s.rank)}</td><td>${attendance}</td><td>${Number(s.points)||0}</td><td>${salaries.length} payment(s)</td><td>${can?`<button class="btn small" onclick="bbSalaryModal('${s.id}')">Record salary</button>`:''}</td></tr>`}).join('')}</tbody></table></div></section><section class="card" style="margin-top:14px"><h3>Recent salary payments</h3>${(db.salaryRecords||[]).slice().sort((a,b)=>new Date(b.paidAt)-new Date(a.paidAt)).slice(0,30).map(x=>`<div class="activity-item"><div class="dot"></div><div><b>${bbEscape(rows.find(s=>s.id===x.soldierId)?.roblox||'Unknown soldier')} · ${bbEscape(x.amount)} ${bbEscape(x.currency||'R$')}</b><small>${bbEscape(x.paidAt)} · Recorded by ${bbEscape(x.recordedBy||'')}</small></div></div>`).join('')||'<p class="muted">No salary payments recorded yet.</p>'}</section>`;
}
function bbSalaryModal(sid){if(!bbIsAdmin()&&!bbCan('finance','finance.manage'))return;const s=db.soldiers.find(x=>x.id===sid);if(!s)return;openModal('Record salary payment',`<p><b>${bbEscape(s.roblox)}</b> · ${bbEscape(s.rank)}</p><div class="portal-form"><label>Amount</label><input id="bbsalary" type="number" min="0" step="0.01"><label>Currency / unit</label><input id="bbcurrency" value="R$" maxlength="12"><label>Date paid</label><input id="bbpaidat" type="date" value="${new Date().toISOString().slice(0,10)}"></div>`,'',`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="bbSaveSalary('${sid}')">Save payment</button>`);}
function bbSaveSalary(sid){const amount=Number(document.getElementById('bbsalary').value),paidAt=document.getElementById('bbpaidat').value,currency=document.getElementById('bbcurrency').value.trim()||'R$';if(!Number.isFinite(amount)||amount<0||!paidAt)return toast('Enter a valid amount and payment date.');db.salaryRecords=db.salaryRecords||[];db.salaryRecords.unshift({id:crypto.randomUUID(),soldierId:sid,amount,currency,paidAt,recordedBy:me.username,createdAt:new Date().toISOString()});log('SALARY_RECORDED',`${sid}: ${amount} ${currency} for ${paidAt}`);save();closeModal();render();}
function bbPropagandaPage(){const can=bbIsAdmin()||bbCan('propaganda','propaganda.manage'),rows=(db.announcements||[]).filter(a=>a.ministry==='propaganda');return `<section class="card" style="margin-top:20px"><div class="section-title"><h3>Media and propaganda</h3>${can?'<button class="btn primary" onclick="bbTikTokModal()">+ Add TikTok video</button>':''}</div>${rows.map(a=>`<article class="portal-announcement"><div class="meta">MEDIA · ${bbEscape(new Date(a.createdAt||Date.now()).toLocaleDateString())}</div><h3>${bbEscape(a.title)}</h3><p>${bbEscape(a.body||'')}</p><a href="${bbEscapeUrl(a.url)}" target="_blank" rel="noopener">Open video ↗</a>${bbIsAdmin()?`<div><button class="btn small danger" onclick="bbDeleteAnnouncement('${a.id}')">Delete</button></div>`:''}</article>`).join('')||'<div class="empty">No media posts yet.</div>'}</section>`;}
function bbTikTokModal(){if(!bbIsAdmin()&&!bbCan('propaganda','propaganda.manage'))return;openModal('Add propaganda video',`<div class="portal-form"><label>Title</label><input id="bbtitle" maxlength="160"><label>Description</label><textarea id="bbbody" rows="4"></textarea><label>TikTok URL</label><input id="bburl" type="url" placeholder="https://www.tiktok.com/@.../video/..."></div>`,'',`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="bbSaveTikTok()">Publish video</button>`);}
function bbSaveTikTok(){const title=document.getElementById('bbtitle').value.trim(),body=document.getElementById('bbbody').value.trim(),url=document.getElementById('bburl').value.trim();if(!title||!url||bbEscapeUrl(url)==='#')return toast('Enter a title and valid TikTok link.');db.announcements=db.announcements||[];db.announcements.unshift({id:crypto.randomUUID(),ministry:'propaganda',title,body,url,visibility:'public',createdAt:new Date().toISOString(),author:me.username,kind:'tiktok'});log('PUBLISH_TIKTOK',title);save();closeModal();render();}
function ensureExtendedData(){
 if(!Array.isArray(db.deployments))db.deployments=[];
 if(!db.promotionPoints)db.promotionPoints={...DEFAULT_PROMOTION_POINTS};
 else Object.entries(DEFAULT_PROMOTION_POINTS).forEach(([r,v])=>{if(db.promotionPoints[r]===undefined)db.promotionPoints[r]=v});
 if(!Array.isArray(db.ministryMembers))db.ministryMembers=[];
 if(!Array.isArray(db.roles))db.roles=[];
 if(!Array.isArray(db.announcements))db.announcements=[];
 if(!Array.isArray(db.salaryRecords))db.salaryRecords=[];
 if(!Array.isArray(db.audit))db.audit=[];
}
function bbSetMe(){if(me){me.isMainAdmin=!!me.isMainAdmin;}}
// Soldier creation keeps existing linked account credentials untouched for non-admin staff.
function saveSoldier(id){
 if(!has('soldiers.manage'))return;
 const roblox=document.getElementById('froblox').value.trim(),discord=document.getElementById('fdiscord').value.trim();
 if(!roblox||!discord)return toast('Enter both Roblox and Discord usernames.');
 const old=db.soldiers.find(x=>x.id===id),soldierId=old?.id||crypto.randomUUID();
 let account=(old?.userId?db.users.find(u=>u.id===old.userId):null)||db.users.find(u=>u.soldierId===soldierId);
 const requestedUsername=(document.getElementById('fsoldieruser')?.value||'').trim();
 const requestedPassword=(document.getElementById('fsoldierpass')?.value||'').trim();
 const s={id:soldierId,roblox,discord,rank:document.getElementById('frank').value,points:Math.max(0,+document.getElementById('fpoints').value||0),brigade:document.getElementById('fbrigade').value,strikes:Math.max(0,+document.getElementById('fstrikes').value||0),notes:document.getElementById('fnotes').value,registered:old?.registered||new Date().toISOString(),userId:account?.id||null};
 if(old)Object.assign(old,s);else db.soldiers.unshift(s);
 let credentials=null;
 if(!account){
  const username=requestedUsername||makeSoldierUsername(),password=requestedPassword||makeSoldierPassword();
  if(db.users.some(u=>u.username.toLowerCase()===username.toLowerCase()))return toast('That username already exists.');
  account={id:crypto.randomUUID(),username,password,display:roblox,role:'Soldier',permissions:[],soldierId:s.id};db.users.push(account);s.userId=account.id;credentials={username,password};
 }
 log(old?'EDIT_SOLDIER':'ADD_SOLDIER',roblox+' · '+discord);
 save();closeModal();drawPage();
 if(credentials)openModal('Soldier account created',`<p>Account linked to <b>${bbEscape(roblox)}</b>.</p><div class="card"><p>Username<br><b>${bbEscape(credentials.username)}</b></p><p>Password<br><b>${bbEscape(credentials.password)}</b></p></div><p class="hint">Give these credentials to the soldier now. The password is stored as a secure hash.</p>`,`<button class="btn" onclick="bbCopyCredentials('${bbEscape(credentials.username)}','${bbEscape(credentials.password)}')">Copy credentials</button>`,`<button class="btn primary" onclick="closeModal()">Close</button>`);
 else toast('Soldier record updated. Existing account credentials were not changed.');
}
function bbCopyCredentials(username,password){const value='Username: '+username+'\nPassword: '+password;navigator.clipboard?.writeText(value).then(()=>toast('Credentials copied.')).catch(()=>toast('Clipboard access unavailable.'));}
function removeSoldier(id){if(!bbIsAdmin())return toast('Only the main administrator can remove linked Soldier accounts.');const s=db.soldiers.find(x=>x.id===id);if(!s||!confirm('Remove soldier '+s.roblox+'?'))return;db.soldiers=db.soldiers.filter(x=>x.id!==id);if(s.userId)db.users=db.users.filter(u=>u.id!==s.userId);log('REMOVE_SOLDIER',s.roblox);save();closeModal();drawPage();}
// Main-administrator-only account administration. Passwords are reset, never displayed in plaintext.
function usersPage(){
 if(!bbIsAdmin())return '<div class="empty">Only the main administrator can manage accounts.</div>';
 const rows=db.users.map(u=>{const soldier=u.soldierId?db.soldiers.find(s=>s.id===u.soldierId):null;return `<tr><td><b>${bbEscape(u.username)}</b></td><td><span class="tag">Password protected</span></td><td>${bbEscape(u.display||'—')}${soldier?`<small class="muted" style="display:block">Soldier: ${bbEscape(soldier.roblox)}</small>`:''}</td><td>${bbEscape(u.role||'Staff')}</td><td>${(u.permissions||[]).length} permissions</td><td><button class="btn small" onclick="userModal('${u.id}')">Edit / reset password</button> ${u.id!==me.id?`<button class="btn small danger" onclick="removeUser('${u.id}')">Remove</button>`:'<span class="tag green">Main Admin</span>'}</td></tr>`}).join('');
 return head('Accounts & permissions','Only the main administrator can edit accounts and reset passwords.',`<button class="btn primary" onclick="userModal()">+ Add account</button>`)+`<div class="card"><p class="muted">Passwords are stored as secure hashes and cannot be viewed. You can set a new password for an account.</p><div class="tablewrap"><table><thead><tr><th>Username</th><th>Password</th><th>Display name</th><th>Role</th><th>Permissions</th><th>Actions</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">No accounts.</td></tr>'}</tbody></table></div></div>`;
}
function userModal(id){
 if(!bbIsAdmin())return;
 const u=db.users.find(x=>x.id===id)||{username:'',display:'',role:'Instructor',permissions:['soldiers.view']};
 const protectedAdmin=!!id&&u.id===me.id;
 if(protectedAdmin){openModal('Main administrator account','<p>This account is protected and cannot be edited, reset or assigned roles.</p>','','<button class="btn primary" onclick="closeModal()">Close</button>');return;}
 openModal(id?'Edit account':'Add account',`<div class="formgrid"><div class="field"><label>Username</label><input id="uusername" value="${bbEscape(u.username)}" ${id?'disabled':''}></div><div class="field"><label>${id?'Set new password (leave blank to keep current)':'Password'}</label><input id="upassword" type="password" autocomplete="new-password" ${protectedAdmin?'placeholder="Main Admin password reset"':''}></div><div class="field"><label>Display name</label><input id="udisplay" value="${bbEscape(u.display||'')}"></div><div class="field"><label>Role</label><select id="urole" ${protectedAdmin?'disabled':''}>${['Instructor','Senior Instructor','Command Staff','Royal Family','Soldier','Staff'].map(x=>`<option ${u.role===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Defence permissions</label>${PERMS.map(p=>`<label class="checkrow"><input type="checkbox" name="uperm" value="${p}" ${(u.permissions||[]).includes('*')||(u.permissions||[]).includes(p)?'checked':''} ${protectedAdmin?'disabled':''}> ${p}</label>`).join('')}</div></div>`,'',`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveUser('${id||''}')">Save account</button>`);
}
async function saveUser(id){
 if(!bbIsAdmin())return;
 if(id&&id===me.id)return toast('The main administrator account is protected.');
 const old=db.users.find(x=>x.id===id),username=old?.username||document.getElementById('uusername').value.trim(),password=document.getElementById('upassword').value;
 if(!username)return toast('Enter a username.');
 if(!old&&db.users.some(u=>u.username.toLowerCase()===username.toLowerCase()))return toast('Username already exists.');
 if(!old&&!password)return toast('Enter a password.');
 const role=old?.id===me.id?old.role:document.getElementById('urole').value;
 const permissions=old?.id===me.id?(old.permissions||[]):[...document.querySelectorAll('input[name="uperm"]:checked')].map(x=>x.value);
 const updated={...(old||{}),id:old?.id||crypto.randomUUID(),username,display:document.getElementById('udisplay').value.trim()||username,role,permissions};
 if(password)updated.password=password;
 if(old)Object.assign(old,updated);else db.users.push(updated);
 log(old?'EDIT_ACCOUNT':'CREATE_ACCOUNT',username+' · '+role);save();closeModal();drawPage();toast('Account saved.');
}
function removeUser(id){if(!bbIsAdmin())return;const u=db.users.find(x=>x.id===id);if(!u||u.id===me.id)return toast('The main administrator account is protected.');if(!confirm(`Remove account ${u.username}?`))return;db.users=db.users.filter(x=>x.id!==id);db.ministryMembers=(db.ministryMembers||[]).filter(x=>x.userId!==id);db.soldiers.forEach(s=>{if(s.userId===id)s.userId=null});log('DELETE_ACCOUNT',u.username);save();drawPage();}
// Public landing page is the default. Keep the legacy Defence UI intact behind its ministry entry.
publicHome();
bbLoadPublic('all');

</script>
</body>
</html>
